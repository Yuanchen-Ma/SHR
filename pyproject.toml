[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "shr-reproduction"
version = "1.0.0"
description = "Code accompanying Selective remaining useful life prediction using conditional moments and historical information"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.4.3",
    "pandas==3.0.2",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "xgboost==3.4.1",
    "torch==2.11.0",
    "PyYAML==6.0.3",
    "pyarrow==25.0.1",
    "h5py==3.16.0",
    "tqdm==4.67.3",
    "joblib==1.5.3",
    "threadpoolctl==3.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shr", "shr.*"]
